# 第 1 层类型检查配置（见 AGENTS.md「怎么算完成」）。
#
# 采用渐进式收口：全树 41 个模块都参与检查，未列在下方的 25 个模块（含 main.py、
# db.py、models/、security.py、config.py、memory_orchestrator、mock_* 等）执行全部
# 默认检查项；下方 16 个模块只豁免标注的具体错误码，其余检查项照常生效。
#
# 豁免根因是同一件事：插件能力是 duck-typing（registry.get 返回 BasePlugin，
# 但调用方使用 collect_alerts / create_ticket / list_entries 等子类方法），
# 以及 AgentPlugin.run 的基类返回类型比实际实现窄。
# 彻底收口 = FEATURES.md Task 24（引入能力 Protocol + 放宽基类签名）。
# 基线：mypy 1.19.0，49 errors / 16 modules，记录于 PROGRESS.md 已知问题 I4。

[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_redundant_casts = True
warn_unreachable = True
show_error_codes = True
namespace_packages = True

[mypy-app.services.pipeline_service]
disable_error_code = attr-defined

[mypy-app.services.notification_service]
disable_error_code = attr-defined

[mypy-app.services.source_monitor]
disable_error_code = attr-defined

[mypy-app.plugins.registry]
disable_error_code = assignment

[mypy-app.plugins.base]
disable_error_code = misc,var-annotated,arg-type

[mypy-app.plugins.airflow_input]
disable_error_code = union-attr,override

[mypy-app.plugins.file_input]
disable_error_code = override

[mypy-app.plugins.feishu_notifier]
disable_error_code = arg-type

[mypy-app.plugins.memory_vector_kb]
disable_error_code = index

[mypy-app.plugins.agents.base]
disable_error_code = attr-defined,misc

[mypy-app.plugins.agents.monitor_agent]
disable_error_code = override

[mypy-app.plugins.agents.reporting_agent]
disable_error_code = union-attr,override,var-annotated

[mypy-app.plugins.agents.reproduction_agent]
disable_error_code = override,attr-defined

[mypy-app.plugins.agents.reviewer_agent]
disable_error_code = misc,override,attr-defined

[mypy-app.plugins.agents.ticket_agent]
disable_error_code = override,attr-defined

[mypy-app.plugins.agents.triage_agent]
disable_error_code = override,attr-defined
