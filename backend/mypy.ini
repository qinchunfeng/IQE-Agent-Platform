# 第 1 层类型检查配置（见 AGENTS.md「怎么算完成」）。
#
# 全树模块参与检查，无 per-module 豁免：插件能力通过
# app/plugins/capabilities.py 的 Protocol 与 registry.get_capability /
# IQEAgent.injected 取用，内核不 import 具体插件类即可通过类型检查。
# 新增豁免段落等于绕过契约，FEATURES.md Task 24 已收口，不得重新引入。

[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_redundant_casts = True
warn_unreachable = True
show_error_codes = True
namespace_packages = True
